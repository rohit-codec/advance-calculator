<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>Calculator</h1>
                <p>Scientific Calculator</p>
            </div>

            <button id="themeBtn" class="icon-btn" title="Toggle theme">
                ☀️
            </button>
        </header>


        <!-- Display -->
        <section class="display">

            <div class="expression" id="expression">
                0
            </div>

            <div class="result" id="result">
                0
            </div>

            <div class="display-tools">

                <button id="copyBtn">
                    Copy
                </button>

                <span id="memoryIndicator">
                    M: 0
                </span>

            </div>

        </section>


        <!-- Calculator Controls -->
        <section class="controls">

            <button id="angleBtn" class="control-btn">
                DEG
            </button>

            <button id="clearBtn" class="danger">
                AC
            </button>

            <button id="deleteBtn">
                DEL
            </button>

            <button data-value="%">
                %
            </button>

        </section>


        <!-- Scientific Buttons -->
        <section class="scientific-buttons">

            <button data-value="sin(">sin</button>
            <button data-value="cos(">cos</button>
            <button data-value="tan(">tan</button>
            <button data-value="log(">log</button>

            <button data-value="ln(">ln</button>
            <button data-value="sqrt(">√</button>
            <button data-value="^2">x²</button>
            <button data-value="^">xʸ</button>

            <button data-value="(">(</button>
            <button data-value=")">)</button>
            <button data-value="pi">π</button>
            <button data-value="e">e</button>

            <button id="factorialBtn">x!</button>
            <button id="memoryClear">MC</button>
            <button id="memoryRecall">MR</button>
            <button id="memoryAdd">M+</button>

        </section>


        <!-- Number Pad -->
        <section class="number-pad">

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="/">÷</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="*">×</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="-">−</button>

            <button data-value="0" class="zero">
                0
            </button>

            <button data-value=".">
                .
            </button>

            <button data-value="+">
                +
            </button>

            <button id="equalsBtn" class="equals">
                =
            </button>

        </section>


        <!-- History -->
        <section class="history-section">

            <div class="history-header">

                <h2>History</h2>

                <button id="clearHistory">
                    Clear
                </button>

            </div>

            <div id="historyList" class="history-list">
                <p class="empty-history">
                    No calculations yet
                </p>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
